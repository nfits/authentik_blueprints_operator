---
apiVersion: v1
kind: ServiceAccount
metadata:
  namespace: authentik
  name: authentik-blueprints-operator-account
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: authentik-blueprints-operator-role-cluster
rules:
  # Framework: runtime observation of namespaces & CRDs (addition/deletion).
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [list, watch]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: authentik
  name: authentik-blueprints-operator-role-namespaced
rules:
  # Framework: posting the events about the handlers progress/errors.
  - apiGroups: [""]
    resources: [events]
    verbs: [create]

  # Application: watching & handling for the custom resource we declare.
  - apiGroups: [""]
    resources: [configmaps, secrets]
    verbs: [get]

  # Application: watching & handling for the custom resource we declare.
  - apiGroups: [cscg.live]
    resources: [blueprints]
    verbs: [list, watch, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: authentik-blueprints-operator-rolebinding-cluster
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: authentik-blueprints-operator-role-cluster
subjects:
  - kind: ServiceAccount
    name: authentik-blueprints-operator-account
    namespace: authentik
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: authentik
  name: authentik-blueprints-operator-rolebinding-namespaced
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: authentik-blueprints-operator-role-namespaced
subjects:
  - kind: ServiceAccount
    name: authentik-blueprints-operator-account
